<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I Saw You</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    .screen {
      padding: 25px;
      width: 100%;
    }

    h1 {
      font-size: 35px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      background: white;
      color: black;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    #countdown {
      font-size: 100px;
      font-weight: bold;
    }

    .red {
      color: red;
    }

    .hidden {
      display: none;
    }

    #finalMessage {
      animation: appear 1.2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <!-- Starting screen -->
  <div class="screen" id="startScreen">
    <h1>I SAW YOU 👁️</h1>

    <p>Something strange has been detected
    👇 Click below to download 
    .</p>
    <p>Tap below to download .</p>

    <button onclick="startPrank()">Download </button>
  </div>

  <!-- Countdown screen -->
  <div class="screen hidden" id="countScreen">
    <h1 class="red">DOWNLOADING... </h1>

    <p>file installing ...</p>

    <div id="countdown">5</div>

    <p id="status">Preparing scan...</p>
  </div>

 
  <div class="screen hidden" id="finalMessage">
    <h1 class="red">VIRUS INPUT SUCCESSFUL </h1>

    <p>YOUR PHONE HAS BEEN INFECTED WITH A VIRUS .</p>

    <p>YOUR PHONE WILL WILL RESET If NOT RESTARTED WITHIN 3HRS</p>

    <button onclick="location.reload()">PLAY AGAIN</button>
  </div>

  <script>
    function startPrank() {
      document.getElementById("startScreen")
        .classList.add("hidden");

      document.getElementById("countScreen")
        .classList.remove("hidden");

      let count = 5;

      const messages = [
        "Preparing scan...",
        "Checking system...",
        "Scanning...",
        "Almost done...",
        "Finalizing..."
      ];

      document.getElementById("status").textContent =
        messages[0];

      const timer = setInterval(function() {
        count--;

        if (count > 0) {
          document.getElementById("countdown")
            .textContent = count;

          document.getElementById("status")
            .textContent = messages[5 - count];
        } else {
          clearInterval(timer);

          document.getElementById("countdown")
            .textContent = "!";

          document.getElementById("status")
            .textContent = "Scan complete!";

          setTimeout(function() {
            showFinalMessage();
          }, 500);
        }
      }, 1000);
    }

    function showFinalMessage() {
      document.getElementById("countScreen")
        .classList.add("hidden");

      document.getElementById("finalMessage")
        .classList.remove("hidden");
    }
  </script>

</body>
</html>
